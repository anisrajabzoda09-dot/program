<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Glow -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#3b82f6" flood-opacity="0.25"/>
    </filter>

    <filter id="innerDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Royal Shield Gradients -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="shieldBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d1f"/>
    </linearGradient>

    <!-- Monogram N Gradients -->
    <linearGradient id="nLeftCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="nCenterSlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="nRightCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Clean Crisp Base Container -->
  <rect x="28" y="28" width="456" height="456" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" filter="url(#shieldGlow)"/>

  <!-- Outer Cyber Shield Rim -->
  <path d="M 256, 60 C 372, 60 424, 108 424, 222 C 424, 334 330, 420 256, 452 C 182, 420 88, 334 88, 222 C 88, 108 140, 60 256, 60 Z" 
        fill="url(#shieldBorderGrad)" opacity="0.95"/>

  <!-- Inner Protective Shield Core -->
  <path d="M 256, 68 C 364, 68 414, 114 414, 222 C 414, 328 324, 410 256, 442 C 188, 410 98, 328 98, 222 C 98, 114 148, 68 256, 68 Z" 
        fill="url(#shieldBodyGrad)"/>

  <!-- Shield Facet Accent Lines -->
  <path d="M 256, 76 L 256, 436" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="6,6"/>
  <path d="M 120, 222 C 120, 316 200, 390 256, 420" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <path d="M 392, 222 C 392, 316 312, 390 256, 420" stroke="#818cf8" stroke-width="2" stroke-opacity="0.25" fill="none"/>

  <!-- HIGH-TECH EMBODIED LETTER 'N' (НИГОҲ) -->
  <g filter="url(#innerDepth)">
    <!-- Left Vertical Wing -->
    <path d="M 162, 168 L 212, 168 L 212, 344 L 162, 316 Z" 
          fill="url(#nLeftCol)" rx="4"/>

    <!-- Right Vertical Wing -->
    <path d="M 300, 196 L 350, 168 L 350, 344 L 300, 344 Z" 
          fill="url(#nRightCol)" rx="4"/>

    <!-- Dynamic Central Diagonal Blade of 'N' -->
    <path d="M 162, 168 L 226, 168 L 350, 320 L 350, 344 L 286, 344 L 162, 192 Z" 
          fill="url(#nCenterSlash)"/>
  </g>

  <!-- Vigilance Guardian Star / Apex Crest (Нигоҳ - Муҳофизати оилавӣ) -->
  <g transform="translate(256, 118)">
    <circle cx="0" cy="0" r="16" fill="#0284c7" opacity="0.4"/>
    <circle cx="0" cy="0" r="11" fill="#ffffff" opacity="0.95"/>
    <circle cx="0" cy="0" r="5" fill="#2563eb"/>
    <!-- Radar ring pulse -->
    <circle cx="0" cy="0" r="22" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.35" stroke-dasharray="3,3"/>
  </g>
</svg>