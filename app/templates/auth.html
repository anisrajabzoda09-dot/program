<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бақайдгирӣ ва Воридшавӣ — НИГОҲ Family</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e0e0e0;
      --shadow-light: #ffffff;
      --shadow-dark: #bebebe;
      --primary: #4f46e5;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: #1e293b;
    }
    
    /* Authentic neumorphism.io/#e0e0e0 shadows */
    .neu-card {
      background: #e0e0e0;
      border-radius: 30px;
      box-shadow: 14px 14px 28px var(--shadow-dark), -14px -14px 28px var(--shadow-light);
    }
    .neu-raised {
      background: #e0e0e0;
      border-radius: 16px;
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      transition: all 0.2s ease;
    }
    .neu-raised:hover {
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    }
    .neu-raised:active {
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    }
    .neu-inset {
      background: #e0e0e0;
      border-radius: 16px;
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      transition: all 0.2s ease;
    }
    .neu-inset:focus-within {
      box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
    }
    .neu-tab-active {
      background: #e0e0e0;
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      color: var(--primary);
    }
    .neu-btn-primary {
      background: linear-gradient(145deg, #544bf7, #473fd0);
      color: #ffffff;
      border-radius: 16px;
      box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
      transition: all 0.2s ease;
    }
    .neu-btn-primary:hover {
      background: linear-gradient(145deg, #5b53ff, #433bc3);
      box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    }
    .neu-btn-primary:active {
      box-shadow: inset 3px 3px 6px #3b35a8, inset -3px -3px 6px #675eff;
      transform: scale(0.99);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 selection:bg-indigo-500 selection:text-white">

  <!-- Main Container -->
  <div class="w-full max-w-[430px] my-auto py-6">
    
    <!-- Neumorphic Logo & Brand Header -->
    <div class="text-center mb-7">
      <a href="/" class="inline-flex flex-col items-center group">
        <!-- Tactile Logo Badge -->
        <div class="w-20 h-20 rounded-3xl neu-raised flex items-center justify-center p-2 mb-3 group-hover:scale-105 transition-transform">
          <img src="/static/images/nigoh_logo.svg" alt="Нигоҳ Family" class="w-full h-full object-contain">
        </div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-black tracking-tight text-slate-800">
            НИГОҲ <span class="text-indigo-600 font-extrabold">FAMILY</span>
          </h1>
        </div>
      </a>
      <p class="text-slate-500 text-xs sm:text-sm mt-1 font-medium">
        Назорати оқилона ва ҳифзи амнияти фарзанд
      </p>
    </div>

    <!-- Main Neumorphic Card (#e0e0e0) -->
    <div class="neu-card p-7 sm:p-8">
      
      <!-- Tactile Google Sign-In Button -->
      <button type="button" id="googleSignInBtn" class="w-full neu-raised py-3.5 px-4 flex items-center justify-center gap-3 text-slate-700 font-bold text-sm mb-6 border-none cursor-pointer">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Воридшавӣ тавассути Google</span>
      </button>

      <!-- Soft Neumorphic Inset Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="h-[2px] flex-1 neu-inset"></div>
        <span class="text-slate-500 text-[11px] uppercase tracking-wider font-bold">ё бо почтаи электронӣ</span>
        <div class="h-[2px] flex-1 neu-inset"></div>
      </div>

      <!-- Neumorphic Segmented Tab Switcher -->
      <div class="neu-inset p-1.5 rounded-2xl flex items-center mb-6">
        <button type="button" id="tabRegister" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 neu-tab-active">
          Бақайдгирӣ
        </button>
        <button type="button" id="tabLogin" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 text-slate-500 hover:text-slate-800">
          Воридшавӣ
        </button>
      </div>

      <!-- Alert Notification Box -->
      <div id="alertBox" class="hidden mb-5 p-3.5 rounded-2xl text-xs font-semibold flex items-center gap-2.5 neu-inset"></div>

      <!-- FORM 1: REGISTRATION -->
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 ml-1">
            Ному насаб
          </label>
          <div class="neu-inset px-3.5 py-2.5 rounded-2xl flex items-center gap-2.5">
            <i class="fa-solid fa-user text-slate-400 text-xs"></i>
            <input type="text" id="regName" required placeholder="Масалан: Ҷамшед Сафаров" class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 ml-1">
            Почтаи электронӣ (Email)
          </label>
          <div class="neu-inset px-3.5 py-2.5 rounded-2xl flex items-center gap-2.5">
            <i class="fa-solid fa-envelope text-slate-400 text-xs"></i>
            <input type="email" id="regEmail" required placeholder="nom@example.com" class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 ml-1">
            Парол
          </label>
          <div class="neu-inset px-3.5 py-2.5 rounded-2xl flex items-center gap-2.5">
            <i class="fa-solid fa-lock text-slate-400 text-xs"></i>
            <input type="password" id="regPassword" required placeholder="Ҳадди ақал 6 рамз" minlength="6" class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 outline-none">
            <button type="button" onclick="togglePass('regPassword', this)" class="text-slate-400 hover:text-slate-600 p-1 text-xs">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="regSubmitBtn" class="w-full neu-btn-primary font-bold py-3.5 px-4 flex items-center justify-center gap-2 mt-4 text-sm">
          <span>Сабти ном ва насби барнома</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- FORM 2: LOGIN -->
      <form id="loginForm" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 ml-1">
            Почтаи электронӣ (Email)
          </label>
          <div class="neu-inset px-3.5 py-2.5 rounded-2xl flex items-center gap-2.5">
            <i class="fa-solid fa-envelope text-slate-400 text-xs"></i>
            <input type="email" id="logEmail" required placeholder="nom@example.com" class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 ml-1">
            Парол
          </label>
          <div class="neu-inset px-3.5 py-2.5 rounded-2xl flex items-center gap-2.5">
            <i class="fa-solid fa-lock text-slate-400 text-xs"></i>
            <input type="password" id="logPassword" required placeholder="Пароли худро нависед" class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 outline-none">
            <button type="button" onclick="togglePass('logPassword', this)" class="text-slate-400 hover:text-slate-600 p-1 text-xs">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="logSubmitBtn" class="w-full neu-btn-primary font-bold py-3.5 px-4 flex items-center justify-center gap-2 mt-4 text-sm">
          <span>Ворид шудан ба система</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
        </button>
      </form>

    </div>

    <!-- Soft Neumorphic Navigation Footers -->
    <div class="flex items-center justify-between text-xs text-slate-500 mt-6 px-3 font-semibold">
      <a href="/" class="hover:text-indigo-600 transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Саҳифаи асосӣ</span>
      </a>
      <a href="/mobile" class="hover:text-indigo-600 transition flex items-center gap-1.5">
        <span>📲 Барномаи мобилӣ</span>
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

  </div>

  <!-- NEUMORPHIC GOOGLE ACCOUNT CHOOSER MODAL -->
  <div id="googleAccountModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
    <div class="neu-card p-6 sm:p-7 max-w-sm w-full animate-in fade-in zoom-in duration-200">
      
      <!-- Google Modal Header -->
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-300/60">
        <div class="flex items-center gap-2.5">
          <svg class="w-6 h-6" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <div>
            <h4 class="font-bold text-sm text-slate-800 leading-tight">Интихоби ҳисоб</h4>
            <p class="text-[11px] text-slate-500">барои воридшавӣ ба «Нигоҳ Family»</p>
          </div>
        </div>
        <button onclick="closeGoogleModal()" class="w-8 h-8 rounded-full neu-raised flex items-center justify-center text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <!-- Account List -->
      <div class="py-2 space-y-3">
        <!-- Account 1 -->
        <button onclick="executeGoogleAuth('Далер Қодиров', 'daler.qodirov@gmail.com', 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80')" class="w-full text-left p-3 rounded-2xl neu-raised flex items-center gap-3 transition cursor-pointer">
          <div class="w-9 h-9 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center shadow">
            ДҚ
          </div>
          <div class="flex-1 min-w-0">
            <h5 class="text-xs font-bold text-slate-800 truncate">Далер Қодиров</h5>
            <p class="text-[11px] text-slate-500 truncate">daler.qodirov@gmail.com</p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
        </button>

        <!-- Account 2 -->
        <button onclick="executeGoogleAuth('Анис Раҷабзода', 'anis.rajabzoda@gmail.com', 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&auto=format&fit=crop&q=80')" class="w-full text-left p-3 rounded-2xl neu-raised flex items-center gap-3 transition cursor-pointer">
          <div class="w-9 h-9 rounded-full bg-emerald-600 text-white font-bold text-xs flex items-center justify-center shadow">
            АР
          </div>
          <div class="flex-1 min-w-0">
            <h5 class="text-xs font-bold text-slate-800 truncate">Анис Раҷабзода</h5>
            <p class="text-[11px] text-slate-500 truncate">anis.rajabzoda@gmail.com</p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
        </button>

        <!-- Custom Account Entry -->
        <div class="pt-2">
          <p class="text-[11px] font-bold text-slate-600 mb-2">Ё почтаи Google-и худро нависед:</p>
          <div class="space-y-2">
            <div class="neu-inset px-3 py-2 rounded-xl">
              <input type="text" id="customGoogleName" placeholder="Номи шумо" class="w-full bg-transparent text-xs text-slate-800 outline-none">
            </div>
            <div class="neu-inset px-3 py-2 rounded-xl">
              <input type="email" id="customGoogleEmail" placeholder="your.email@gmail.com" class="w-full bg-transparent text-xs text-slate-800 outline-none">
            </div>
            <button onclick="submitCustomGoogle()" class="w-full neu-btn-primary text-xs font-bold py-2.5 rounded-xl cursor-pointer">
              Воридшавӣ бо ин аккаунт ➔
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    const tabRegister = document.getElementById('tabRegister');
    const tabLogin = document.getElementById('tabLogin');
    const registerForm = document.getElementById('registerForm');
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const googleSignInBtn = document.getElementById('googleSignInBtn');

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden');
      if (isError) {
        alertBox.style.color = '#dc2626';
        alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation text-sm"></i> <span>${msg}</span>`;
      } else {
        alertBox.style.color = '#16a34a';
        alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-sm"></i> <span>${msg}</span>`;
      }
    }

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('neu-tab-active');
      tabRegister.classList.remove('text-slate-500');
      tabLogin.classList.remove('neu-tab-active');
      tabLogin.classList.add('text-slate-500');
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      alertBox.classList.add('hidden');
    });

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('neu-tab-active');
      tabLogin.classList.remove('text-slate-500');
      tabRegister.classList.remove('neu-tab-active');
      tabRegister.classList.add('text-slate-500');
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      alertBox.classList.add('hidden');
    });

    // Password visibility toggle
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    // Google Modal Controls
    googleSignInBtn.addEventListener('click', () => {
      document.getElementById('googleAccountModal').classList.remove('hidden');
    });

    function closeGoogleModal() {
      document.getElementById('googleAccountModal').classList.add('hidden');
    }

    async function executeGoogleAuth(fullName, email, avatar) {
      closeGoogleModal();
      showAlert('Ҳисоби Google санҷида шуда истодааст...', false);
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            avatar: avatar || 'https://lh3.googleusercontent.com/a/default-user'
          })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert(`Хуш омадед, ${fullName}! Воридшавӣ тасдиқ шуд. Гузариш...`, false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 600);
        } else {
          showAlert(data.detail || 'Хатогӣ дар воридшавӣ бо Google');
        }
      } catch (err) {
        showAlert('Хатогии шабака рух дод. Лутфан дубора санҷед.');
      }
    }

    function submitCustomGoogle() {
      const name = document.getElementById('customGoogleName').value.trim() || 'Корбари Google';
      const email = document.getElementById('customGoogleEmail').value.trim();
      if (!email || !email.includes('@')) {
        alert('Лутфан суроғаи дурусти почтаи Google-ро ворид кунед!');
        return;
      }
      executeGoogleAuth(name, email, 'https://lh3.googleusercontent.com/a/default-user');
    }

    // Register Submit
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Бақайдгирӣ бомуваффақият анҷом ёфт! Гузариш...', false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 600);
        } else {
          showAlert(data.detail || 'Хатогӣ ҳангоми бақайдгирӣ');
        }
      } catch (err) {
        showAlert('Хатогии шабака рух дод');
      }
    });

    // Login Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('logEmail').value.trim();
      const password = document.getElementById('logPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Хуш омадед! Ворид шудед. Гузариш...', false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 600);
        } else {
          showAlert(data.detail || 'Почта ё парол нодуруст аст');
        }
      } catch (err) {
        showAlert('Хатогии шабака рух дод');
      }
    });
  </script>

</body>
</html>
