<!DOCTYPE html>
<html lang="tg" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бақайдгирӣ ва Воридшавӣ — НИГОҲ Family</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
      background: rgba(2, 6, 23, 0.9);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 relative selection:bg-indigo-500 selection:text-white">

  <!-- Ambient Glowing Background Accents -->
  <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-3xl pointer-events-none -z-10"></div>
  <div class="fixed bottom-10 right-10 w-80 h-80 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

  <!-- Main Container -->
  <div class="w-full max-w-[440px] my-auto">
    
    <!-- Brand Logo & Header -->
    <div class="text-center mb-6">
      <a href="/" class="inline-flex items-center gap-2.5 text-2xl font-black tracking-tight text-white hover:opacity-90 transition active:scale-95">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-500/25 border border-indigo-400/30">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <span>НИГОҲ <span class="text-indigo-400 font-extrabold">FAMILY</span></span>
      </a>
      <p class="text-slate-400 text-xs sm:text-sm mt-2 font-medium">
        Назорати оқилона ва ҳифзи амнияти фарзанд
      </p>
    </div>

    <!-- Main Glassmorphic Card -->
    <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative">
      
      <!-- Primary Google Sign-In Button -->
      <button type="button" id="googleSignInBtn" class="w-full bg-white hover:bg-slate-100 text-slate-800 font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center gap-3 shadow-lg shadow-black/10 hover:shadow-xl transition-all duration-200 active:scale-[0.98] border border-slate-200 mb-5">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span class="text-sm">Воридшавӣ тавассути Google</span>
      </button>

      <!-- Clean Divider -->
      <div class="flex items-center gap-3 my-5">
        <div class="h-px bg-slate-800 flex-1"></div>
        <span class="text-slate-400 text-xs uppercase tracking-wider font-semibold">ё бо почтаи электронӣ</span>
        <div class="h-px bg-slate-800 flex-1"></div>
      </div>

      <!-- Segmented Modern Tabs Switcher -->
      <div class="bg-slate-950/80 p-1 rounded-2xl border border-slate-800/80 flex items-center mb-6">
        <button type="button" id="tabRegister" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-md shadow-indigo-600/20">
          Бақайдгирӣ
        </button>
        <button type="button" id="tabLogin" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200">
          Воридшавӣ
        </button>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium border flex items-center gap-2.5 transition-all"></div>

      <!-- Form 1: Registration Form -->
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
            <i class="fa-regular fa-user text-indigo-400"></i>
            <span>Ному насаб</span>
          </label>
          <input type="text" id="regName" required placeholder="Масалан: Ҷамшед Сафаров" class="glass-input w-full px-3.5 py-3 rounded-xl text-sm text-white placeholder-slate-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
            <i class="fa-regular fa-envelope text-indigo-400"></i>
            <span>Почтаи электронӣ (Email)</span>
          </label>
          <input type="email" id="regEmail" required placeholder="nom@example.com" class="glass-input w-full px-3.5 py-3 rounded-xl text-sm text-white placeholder-slate-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
            <i class="fa-regular fa-lock text-indigo-400"></i>
            <span>Парол</span>
          </label>
          <div class="relative">
            <input type="password" id="regPassword" required placeholder="Ҳадди ақал 6 рамз" minlength="6" class="glass-input w-full px-3.5 py-3 pr-10 rounded-xl text-sm text-white placeholder-slate-500 outline-none">
            <button type="button" onclick="togglePass('regPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-xs p-1">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="regSubmitBtn" class="w-full bg-gradient-to-r from-indigo-600 via-indigo-500 to-emerald-500 hover:from-indigo-500 hover:to-emerald-400 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
          <span>Сабти ном ва идома</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Form 2: Login Form -->
      <form id="loginForm" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
            <i class="fa-regular fa-envelope text-indigo-400"></i>
            <span>Почтаи электронӣ (Email)</span>
          </label>
          <input type="email" id="logEmail" required placeholder="nom@example.com" class="glass-input w-full px-3.5 py-3 rounded-xl text-sm text-white placeholder-slate-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5 flex items-center gap-1.5">
            <i class="fa-regular fa-lock text-indigo-400"></i>
            <span>Парол</span>
          </label>
          <div class="relative">
            <input type="password" id="logPassword" required placeholder="Пароли худро ворид кунед" class="glass-input w-full px-3.5 py-3 pr-10 rounded-xl text-sm text-white placeholder-slate-500 outline-none">
            <button type="button" onclick="togglePass('logPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-xs p-1">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="logSubmitBtn" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
          <span>Ворид шудан ба система</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
        </button>
      </form>

    </div>

    <!-- Footer Links -->
    <div class="flex items-center justify-between text-xs text-slate-400 mt-5 px-2">
      <a href="/" class="hover:text-indigo-400 transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Саҳифаи асосӣ</span>
      </a>
      <a href="/mobile" class="hover:text-emerald-400 transition flex items-center gap-1.5 font-bold">
        <span>📲 Барномаи мобилӣ</span>
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

  </div>

  <!-- REALISTIC GOOGLE ACCOUNT CHOOSER MODAL -->
  <div id="googleAccountModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
    <div class="bg-white text-slate-800 rounded-3xl p-6 sm:p-7 max-w-sm w-full shadow-2xl border border-slate-200 animate-in fade-in zoom-in duration-200">
      
      <!-- Google Modal Header -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <svg class="w-6 h-6" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <div>
            <h4 class="font-bold text-sm text-slate-900 leading-tight">Интихоби ҳисоб</h4>
            <p class="text-[11px] text-slate-500">барои воридшавӣ ба «Нигоҳ Family»</p>
          </div>
        </div>
        <button onclick="closeGoogleModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Account List -->
      <div class="py-3 space-y-2">
        <!-- Account 1 -->
        <button onclick="executeGoogleAuth('Далер Қодиров', 'daler.qodirov@gmail.com', 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80')" class="w-full text-left p-2.5 rounded-2xl hover:bg-slate-50 active:bg-slate-100 border border-transparent hover:border-slate-200 transition flex items-center gap-3 group">
          <div class="w-10 h-10 rounded-full bg-indigo-600 text-white font-bold text-sm flex items-center justify-center shadow">
            ДҚ
          </div>
          <div class="flex-1 min-w-0">
            <h5 class="text-xs font-bold text-slate-900 truncate group-hover:text-indigo-600 transition">Далер Қодиров</h5>
            <p class="text-[11px] text-slate-500 truncate">daler.qodirov@gmail.com</p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        </button>

        <!-- Account 2 -->
        <button onclick="executeGoogleAuth('Анис Раҷабзода', 'anis.rajabzoda@gmail.com', 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&auto=format&fit=crop&q=80')" class="w-full text-left p-2.5 rounded-2xl hover:bg-slate-50 active:bg-slate-100 border border-transparent hover:border-slate-200 transition flex items-center gap-3 group">
          <div class="w-10 h-10 rounded-full bg-emerald-600 text-white font-bold text-sm flex items-center justify-center shadow">
            АР
          </div>
          <div class="flex-1 min-w-0">
            <h5 class="text-xs font-bold text-slate-900 truncate group-hover:text-emerald-600 transition">Анис Раҷабзода</h5>
            <p class="text-[11px] text-slate-500 truncate">anis.rajabzoda@gmail.com</p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        </button>

        <!-- Custom Account Entry -->
        <div class="pt-2 border-t border-slate-100">
          <p class="text-[11px] font-bold text-slate-600 mb-1.5">Ё почтаи Google-и худро нависед:</p>
          <div class="space-y-2">
            <input type="text" id="customGoogleName" placeholder="Номи шумо" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
            <input type="email" id="customGoogleEmail" placeholder="your.email@gmail.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500">
            <button onclick="submitCustomGoogle()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-xl active:scale-95 transition shadow">
              Воридшавӣ бо ин аккаунт ➔
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Tab switching logic
    const tabRegister = document.getElementById('tabRegister');
    const tabLogin = document.getElementById('tabLogin');
    const registerForm = document.getElementById('registerForm');
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const googleSignInBtn = document.getElementById('googleSignInBtn');

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      if (isError) {
        alertBox.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-400');
        alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation text-sm"></i> <span>${msg}</span>`;
      } else {
        alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
        alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-sm"></i> <span>${msg}</span>`;
      }
    }

    tabRegister.addEventListener('click', () => {
      tabRegister.className = "flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-md shadow-indigo-600/20";
      tabLogin.className = "flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      alertBox.classList.add('hidden');
    });

    tabLogin.addEventListener('click', () => {
      tabLogin.className = "flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-md shadow-indigo-600/20";
      tabRegister.className = "flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      alertBox.classList.add('hidden');
    });

    // Password visibility toggle
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    // Google Modal Controls
    googleSignInBtn.addEventListener('click', () => {
      document.getElementById('googleAccountModal').classList.remove('hidden');
    });

    function closeGoogleModal() {
      document.getElementById('googleAccountModal').classList.add('hidden');
    }

    async function executeGoogleAuth(fullName, email, avatar) {
      closeGoogleModal();
      showAlert('Ҳисоби Google санҷида шуда истодааст...', false);
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            avatar: avatar || 'https://lh3.googleusercontent.com/a/default-user'
          })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert(`Хуш омадед, ${fullName}! Воридшавӣ тасдиқ шуд. Гузариш...`, false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 600);
        } else {
          showAlert(data.detail || 'Хатогӣ дар воридшавӣ бо Google');
        }
      } catch (err) {
        showAlert('Хатогии шабака рух дод. Лутфан дубора кӯшиш кунед.');
      }
    }

    function submitCustomGoogle() {
      const name = document.getElementById('customGoogleName').value.trim() || 'Корбари Google';
      const email = document.getElementById('customGoogleEmail').value.trim();
      if (!email || !email.includes('@')) {
        alert('Лутфан суроғаи дурусти почтаи Google-ро ворид кунед!');
        return;
      }
      executeGoogleAuth(name, email, 'https://lh3.googleusercontent.com/a/default-user');
    }

    // Register Submit
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Бақайдгирӣ бомуваффақият анҷом ёфт! Гузариш...', false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 600);
        } else {
          showAlert(data.detail || 'Хатогӣ ҳангоми бақайдгирӣ');
        }
      } catch (err) {
        showAlert('Хатогии шабака рух дод');
      }
    });

    // Login Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('logEmail').value.trim();
      const password = document.getElementById('logPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Хуш омадед! Ворид шудед. Гузариш...', false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 600);
        } else {
          showAlert(data.detail || 'Почта ё парол нодуруст аст');
        }
      } catch (err) {
        showAlert('Хатогии шабака рух дод');
      }
    });
  </script>

</body>
</html>
