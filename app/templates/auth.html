<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бақайдгирӣ ва Воридшавӣ — НИГОҲ Family</title>
  
  <!-- Canonical, Favicon & Meta -->
  <link rel="canonical" href="https://nigohfamily.qobus.tj/auth">
  <link rel="icon" type="image/png" href="/static/images/nigoh_family_icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Бақайдгирӣ ва Воридшавӣ — НИГОҲ Family">
  <meta property="og:description" content="Платформаи назорати оқилона ва ҳифзи амнияти оила дар Тоҷикистон">
  <meta property="og:url" content="https://nigohfamily.qobus.tj/auth">
  <meta property="og:image" content="https://nigohfamily.qobus.tj/static/images/nigoh_family_icon.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Google Identity Services (Official OAuth SDK) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
        linear-gradient(to bottom, #ffffff, #f8fafc);
      color: #0f172a;
    }
    
    .white-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06), 0 0 0 1px rgba(226, 232, 240, 0.8);
    }
    .white-input {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .white-input:focus-within {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
      box-shadow: 0 12px 25px -4px rgba(79, 70, 229, 0.45);
      transform: translateY(-1.5px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 selection:bg-indigo-600 selection:text-white">

  <!-- Main Container -->
  <div class="w-full max-w-[420px] my-auto py-6">
    
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <a href="/" class="inline-flex flex-col items-center group">
        <!-- Logo Badge -->
        <div class="w-20 h-20 rounded-2xl bg-white border border-slate-200 shadow-md flex items-center justify-center p-2 mb-3 group-hover:scale-105 transition-transform ring-4 ring-indigo-50/50">
          <img src="/static/images/nigoh_family_icon.png" alt="Нигоҳ Family" class="w-full h-full object-contain">
        </div>
        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-700 text-[10px] font-black uppercase tracking-wider mb-1.5 shadow-2xs">
          <span>🇹🇯 Тоҷикистон</span>
        </div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-black tracking-tight text-slate-900">
            НИГОҲ <span class="text-indigo-600 font-extrabold">FAMILY</span>
          </h1>
        </div>
      </a>
      <p class="text-slate-500 text-xs sm:text-sm mt-1 font-medium">
        Назорати оқилона ва ҳифзи амнияти фарзанд
      </p>
    </div>

    <!-- Main White Card -->
    <div class="white-card p-6 sm:p-8">
      
      <!-- Google Sign-In Button -->
      <button type="button" id="googleSignInBtn" class="w-full bg-white hover:bg-slate-50 border border-slate-200/90 py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 text-slate-800 font-black text-sm mb-6 shadow-xs hover:shadow-md transition duration-200 cursor-pointer">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Воридшавӣ бо ҳисоби Google</span>
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="h-px flex-1 bg-slate-200"></div>
        <span class="text-slate-400 text-[11px] uppercase tracking-wider font-bold">ё бо почтаи электронӣ</span>
        <div class="h-px flex-1 bg-slate-200"></div>
      </div>

      <!-- Tab Switcher -->
      <div class="bg-slate-100 p-1 rounded-xl flex mb-6">
        <button id="tabRegister" class="flex-1 py-2.5 rounded-lg text-xs font-black transition duration-200 bg-white shadow-xs text-indigo-600">
          Бақайдгирӣ
        </button>
        <button id="tabLogin" class="flex-1 py-2.5 rounded-lg text-xs font-black transition duration-200 text-slate-500 hover:text-slate-900">
          Воридшавӣ
        </button>
      </div>

      <!-- Alert Message Box -->
      <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border"></div>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">Ному насаб</label>
          <div class="white-input px-3.5 py-2.5 flex items-center gap-3">
            <i class="fa-solid fa-user text-slate-400 text-xs"></i>
            <input type="text" id="regName" required placeholder="Муҳаммадҷон Раҳимов" class="w-full bg-transparent text-sm text-slate-900 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">Почтаи электронӣ (Email)</label>
          <div class="white-input px-3.5 py-2.5 flex items-center gap-3">
            <i class="fa-solid fa-envelope text-slate-400 text-xs"></i>
            <input type="email" id="regEmail" required placeholder="example@mail.tj" class="w-full bg-transparent text-sm text-slate-900 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">Парол</label>
          <div class="white-input px-3.5 py-2.5 flex items-center gap-3">
            <i class="fa-solid fa-lock text-slate-400 text-xs"></i>
            <input type="password" id="regPassword" required placeholder="Ҳадди ақал 6 рамз" minlength="6" class="w-full bg-transparent text-sm text-slate-900 outline-none">
          </div>
        </div>

        <button type="submit" id="regSubmitBtn" class="w-full btn-primary font-bold py-3.5 px-4 flex items-center justify-center gap-2 mt-4 text-sm">
          <span>Сабти ном кардан</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">Почтаи электронӣ (Email)</label>
          <div class="white-input px-3.5 py-2.5 flex items-center gap-3">
            <i class="fa-solid fa-envelope text-slate-400 text-xs"></i>
            <input type="email" id="logEmail" required placeholder="example@mail.tj" class="w-full bg-transparent text-sm text-slate-900 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">Парол</label>
          <div class="white-input px-3.5 py-2.5 flex items-center gap-3">
            <i class="fa-solid fa-lock text-slate-400 text-xs"></i>
            <input type="password" id="logPassword" required placeholder="Пароли шумо" class="w-full bg-transparent text-sm text-slate-900 outline-none">
          </div>
        </div>

        <button type="submit" id="logSubmitBtn" class="w-full btn-primary font-bold py-3.5 px-4 flex items-center justify-center gap-2 mt-4 text-sm">
          <span>Ворид шудан ба система</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
        </button>
      </form>

      <!-- Security Guarantee inside card -->
      <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-center gap-2 text-xs text-slate-500 font-medium">
        <i class="fa-solid fa-shield-halved text-emerald-500"></i>
        <span>Ҳифзи пурраи махфият ва амнияти маълумот</span>
      </div>

    </div>

    <!-- Navigation Footers -->
    <div class="flex items-center justify-between text-xs text-slate-500 mt-6 px-3 font-semibold">
      <a href="/" class="hover:text-indigo-600 transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Саҳифаи асосӣ</span>
      </a>
      <a href="/download/android" class="hover:text-indigo-600 transition flex items-center gap-1.5">
        <i class="fa-brands fa-android text-indigo-500"></i>
        <span>Боргирии APK</span>
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    const tabRegister = document.getElementById('tabRegister');
    const tabLogin = document.getElementById('tabLogin');
    const registerForm = document.getElementById('registerForm');
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const googleSignInBtn = document.getElementById('googleSignInBtn');

    // Switch Tabs
    tabRegister.addEventListener('click', () => {
      tabRegister.className = 'flex-1 py-2.5 rounded-lg text-xs font-black transition duration-200 bg-white shadow-xs text-indigo-600';
      tabLogin.className = 'flex-1 py-2.5 rounded-lg text-xs font-black transition duration-200 text-slate-500 hover:text-slate-900';
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      hideAlert();
    });

    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'flex-1 py-2.5 rounded-lg text-xs font-black transition duration-200 bg-white shadow-xs text-indigo-600';
      tabRegister.className = 'flex-1 py-2.5 rounded-lg text-xs font-black transition duration-200 text-slate-500 hover:text-slate-900';
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      hideAlert();
    });

    function showAlert(msg, isError = false) {
      alertBox.textContent = msg;
      alertBox.className = `mb-4 p-3 rounded-lg text-xs font-medium border ${
        isError 
          ? 'bg-rose-50 text-rose-700 border-rose-200' 
          : 'bg-emerald-50 text-emerald-700 border-emerald-200'
      }`;
      alertBox.classList.remove('hidden');
    }

    function hideAlert() {
      alertBox.classList.add('hidden');
    }

    // Official Google OAuth 2.0 Identity Client
    const GOOGLE_CLIENT_ID = '1040006931222-39iacj22kk6me8go2vvkrr0bpu845mp4.apps.googleusercontent.com';
    let googleTokenClient = null;

    function initGoogleClient() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email openid',
          prompt: 'select_account',
          callback: async (tokenResponse) => {
            if (tokenResponse && tokenResponse.access_token) {
              showAlert("Дар ҳоли тасдиқи ҳисоби Google ва воридшавӣ...", false);
              try {
                const userInfoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                  headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                });
                if (!userInfoRes.ok) {
                  throw new Error("Маълумоти ҳисоби Google қабул нашуд");
                }
                const profile = await userInfoRes.json();
                await executeGoogleAuth(profile.name || profile.email, profile.email, profile.picture, profile.sub, tokenResponse.access_token);
              } catch (err) {
                console.error(err);
                showAlert("Хатогӣ ҳангоми воридшавӣ бо Google: " + err.message, true);
              }
            } else if (tokenResponse && tokenResponse.error) {
              showAlert("Интихоби ҳисоби Google қатъ карда шуд", true);
            }
          },
          error_callback: (err) => {
            console.error("Google Auth Error:", err);
            showAlert("Хатогӣ дар пайвастшавӣ ба хидмати Google", true);
          }
        });
      }
    }

    // Google Sign-In Trigger
    googleSignInBtn.addEventListener('click', () => {
      showAlert("Равзанаи интихоби ҳисоби Google кушода шуда истодааст...", false);
      if (!googleTokenClient) {
        initGoogleClient();
      }
      if (googleTokenClient) {
        googleTokenClient.requestAccessToken({ prompt: 'select_account' });
      } else {
        let retries = 0;
        const interval = setInterval(() => {
          retries++;
          initGoogleClient();
          if (googleTokenClient) {
            clearInterval(interval);
            googleTokenClient.requestAccessToken({ prompt: 'select_account' });
          } else if (retries > 10) {
            clearInterval(interval);
            showAlert("Китобхонаи Google ҳанӯз бор нашуд. Лутфан пайвасти интернетро санҷед.", true);
          }
        }, 200);
      }
    });

    // Execute Google Authentication with backend
    async function executeGoogleAuth(fullName, email, avatar, googleId, accessToken) {
      showAlert("Хуш омадед! Ҳисоби шумо тасдиқ шуд, ворид шуда истодаед...", false);
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            avatar: avatar || 'https://lh3.googleusercontent.com/a/default-user',
            google_id: googleId,
            token: accessToken
          })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          showAlert("Бомуваффақият ворид шудед! Ба бахши насб гузашта истодаед...", false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 500);
        } else {
          showAlert(data.detail || "Хатогӣ ҳангоми воридшавӣ бо Google", true);
        }
      } catch (err) {
        showAlert("Хатогии шабака. Лутфан дубора санҷед.", true);
      }
    }

    // Form Submissions
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Интизор шавед...</span>';
      hideAlert();

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          showAlert("Шумо бомуваффақият сабти ном шудед! Ба сомона гузашта истодаед...", false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 800);
        } else {
          showAlert(data.detail || "Хатогӣ ҳангоми сабти ном", true);
          btn.disabled = false;
          btn.innerHTML = '<span>Сабти ном кардан</span><i class="fa-solid fa-arrow-right text-xs"></i>';
        }
      } catch (err) {
        showAlert("Хатогии пайвастшавӣ ба сервер", true);
        btn.disabled = false;
        btn.innerHTML = '<span>Сабти ном кардан</span><i class="fa-solid fa-arrow-right text-xs"></i>';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('logSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Интизор шавед...</span>';
      hideAlert();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('logEmail').value,
            password: document.getElementById('logPassword').value
          })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          showAlert("Хуш омадед! Ворид шуда истодаед...", false);
          setTimeout(() => {
            window.location.href = data.redirect || '/#download';
          }, 800);
        } else {
          showAlert(data.detail || "Почта ё пароли нодуруст", true);
          btn.disabled = false;
          btn.innerHTML = '<span>Ворид шудан ба система</span><i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>';
        }
      } catch (err) {
        showAlert("Хатогии пайвастшавӣ ба сервер", true);
        btn.disabled = false;
        btn.innerHTML = '<span>Ворид шудан ба система</span><i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>';
      }
    });
  </script>

</body>
</html>
