<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth antialiased dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeEvolveIT — your tech partner. evolved.</title>
  <meta name="description" content="AI specialists. A five-phase method — Discover, Diagnose, Design, Deliver, Evolve — that transforms how your business runs on technology. HQ Monterrey, presence in Dubai, 17 countries served." />
  <meta name="theme-color" content="#0e0e10" />

  <!-- Fonts: JetBrains Mono & Plus Jakarta Sans / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0e0e10',
            card: '#161619',
            cardHover: '#1d1d22',
            borderHairline: 'rgba(255, 255, 255, 0.08)',
            accent: '#E4007C',
            accentGlow: 'rgba(228, 0, 124, 0.25)',
            accentPurple: '#8A2BE2',
            waGreen: '#25D366'
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          keyframes: {
            pulseSlow: {
              '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.05)' }
            },
            radarSweep: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' }
            },
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' }
            }
          },
          animation: {
            'pulse-slow': 'pulseSlow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'radar': 'radarSweep 6s linear infinite',
            'marquee': 'marquee 35s linear infinite'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0e0e10;
      color: #ededf0;
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
    }
    ::selection {
      background: #E4007C;
      color: #ffffff;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0e0e10;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272e;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #E4007C;
    }
    /* Glow borders */
    .candle-glow {
      position: relative;
      transition: all 0.3s ease;
    }
    .candle-glow:hover {
      border-color: rgba(228, 0, 124, 0.45);
      box-shadow: 0 0 25px rgba(228, 0, 124, 0.15), inset 0 0 15px rgba(228, 0, 124, 0.05);
    }
    .text-glow {
      text-shadow: 0 0 20px rgba(228, 0, 124, 0.6);
    }
    .badge-pink {
      background: rgba(228, 0, 124, 0.12);
      border: 1px solid rgba(228, 0, 124, 0.35);
      color: #ff3da6;
    }
    .glass-pill {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
  </style>
</head>
<body class="min-h-full flex flex-col bg-bg text-[#ededf0] antialiased selection:bg-accent selection:text-white">

  <!-- Background Interactive Canvas (Subtle Starfield / Constellation Effect) -->
  <div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden" aria-hidden="true">
    <canvas id="matrix-canvas" class="w-full h-full opacity-35"></canvas>
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[500px] bg-gradient-to-b from-[#E4007C]/15 via-[#8A2BE2]/10 to-transparent blur-[120px] rounded-full pointer-events-none"></div>
  </div>

  <main id="main-content" class="flex-1">
    <!-- Sections will be incrementally added here -->
    <div class="py-20 text-center text-zinc-500 text-xs">
      [WeEvolveIT Platform Initializing...]
    </div>
  </main>

  <script>
    // Canvas subtle particle effect
    const canvas = document.getElementById('matrix-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let width, height, particles;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        const count = Math.floor(width / 24);
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.5 + 0.5,
            vx: (Math.random() - 0.5) * 0.25,
            vy: (Math.random() - 0.5) * 0.25,
            alpha: Math.random() * 0.5 + 0.2
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#ffffff';
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * 0.4})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    }
  </script>
</body>
</html>
