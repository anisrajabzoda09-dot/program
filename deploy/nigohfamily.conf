# Nginx Reverse Proxy Configuration for NIGOH Family
# Domain: nigohfamily.qobus.tj
# Target: FastAPI / Uvicorn listening on 127.0.0.1:8080

server {
    listen 80;
    listen [::]:80;
    server_name nigohfamily.qobus.tj;

    client_max_body_size 150M;

    # Proxy all traffic to NIGOH Family FastAPI backend
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
